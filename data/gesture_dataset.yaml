# Cấu hình Dataset YOLOv8/YOLOv11 cho Điều khiển Thiết bị Không chạm (Touchless Control)
# [Reference-only template]: Thư mục ../datasets/hand_gestures không có sẵn cục bộ;
# ứng dụng hiện dùng 21-keypoint pose + hình học + MediaPipe GestureRecognizer (gồm cả PINCH_VOLUME).
path: ../datasets/hand_gestures  # Thư mục gốc chứa dữ liệu (chỉ mang tính tham khảo)
train: images/train
val: images/val
test: images/test

# 7 lớp cử chỉ rời rạc điều khiển hệ thống (bên cạnh cử chỉ liên tục PINCH_VOLUME)
nc: 7

names:
  0: OPEN_PALM      # Play / Pause Media
  1: FIST           # Mute / Unmute Audio
  2: THUMBS_UP      # Tăng âm lượng (+6%)
  3: THUMBS_DOWN    # Giảm âm lượng (-6%)
  4: POINT_RIGHT    # Bài tiếp theo / Tua tới (Next Track)
  5: POINT_LEFT     # Bài trước đó / Tua lùi (Prev Track)
  6: PEACE          # Chụp ảnh màn hình (Screenshot)
